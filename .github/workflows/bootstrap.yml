name: Materialize GuestAtlas source

on:
  push:
    branches: [main]
    paths:
      - '.guestatlas-bootstrap.ready'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.guestatlas-bootstrap.part-*)
          test "${#parts[@]}" -eq 12
          cat "${parts[@]}" | base64 -d > /tmp/guestatlas-source.tar.gz
          echo '4e56c97e3430cce91cee1dfb7be4e7f615ea2b87aa6ac541580d9afe819e1c99  /tmp/guestatlas-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/guestatlas-source.tar.gz -C .
          # A workflow token cannot create another workflow without workflow permission.
          # CI is installed separately through the authorized GitHub connection.
          rm -f .github/workflows/ci.yml
          rm -f .guestatlas-bootstrap.ready .guestatlas-bootstrap.part-*

      - name: Commit materialized application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize GuestAtlas application'
          git push origin HEAD:main
